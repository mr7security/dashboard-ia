<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ChatGPT Enterprise · SGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --fondo:#121A2C; --panel:#1E2A44; --panel2:#18223A; --borde:#2B3A5C; --linea:rgba(43,58,92,.55);
  --texto:#EEF2F9; --suave:#A9B8D4; --tenue:#7C8CAB;
  --oro:#C49A2A; --oro2:#E3BC55; --sobre-oro:#121A2C;
  --azul:#6FA8DC; --verde:#4FBFA8; --lila:#B49AE0; --rosa:#E58FB1;
  --ok:#5CC08A; --aviso:#E8A33D; --error:#EC7063;
  --globo:#0C1322;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-tema=claro]{
  --fondo:#F3F5F9; --panel:#FFFFFF; --panel2:#EEF1F6; --borde:#D5DBE6; --linea:#E4E8F0;
  --texto:#172033; --suave:#4D5B76; --tenue:#7A869C;
  --oro:#A87F14; --oro2:#8E6A0C; --sobre-oro:#FFFFFF;
  --azul:#2F6FB3; --verde:#1F8F7A; --lila:#7453B8; --rosa:#B8457A;
  --ok:#23875A; --aviso:#B46B00; --error:#C23B2E;
  --globo:#FFFFFF;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--sans);font-size:15px;line-height:1.45}
.pagina{max-width:1440px;margin:0 auto;padding:22px 16px 48px;display:flex;flex-direction:column;gap:16px}

header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--borde)}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:54px;width:auto;flex:none}
.logo.claro,html[data-tema=claro] .logo.oscuro{display:none}
html[data-tema=claro] .logo.claro{display:block}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{margin-top:2px;font-size:13.5px;color:var(--suave)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#reloj-box{text-align:right;line-height:1.2;margin-left:6px}
#clock{font-size:.85rem;color:var(--texto);font-variant-numeric:tabular-nums}
#servidor{font-size:.72rem;color:var(--suave);margin-top:2px}
#servidor:not(:empty)::before{content:"🖥 "}
.chip{font-family:var(--mono);font-size:12.5px;color:var(--suave);border:1px solid var(--borde);padding:7px 11px;border-radius:4px;white-space:nowrap}
.chip.demo{color:var(--oro2);border-color:var(--oro);font-weight:600}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--suave);background:transparent;border:1px solid var(--borde);padding:7px 11px;border-radius:4px;white-space:nowrap}
.btn:hover{color:var(--texto);border-color:var(--tenue)}
.btn.principal{color:var(--sobre-oro);background:var(--oro);border-color:var(--oro)}
.btn.principal:hover{filter:brightness(1.1)}
.btn.activo{color:var(--oro2);border-color:var(--oro)}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--oro2);outline-offset:2px}

.fuente{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--borde);border-radius:6px;padding:9px 12px;font-size:13px;color:var(--suave)}
.fuente b{color:var(--texto);font-weight:600}
.punto{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--tenue)}
.punto.ok{background:var(--ok)} .punto.error{background:var(--error)} .punto.sin_configurar{background:var(--aviso)}
#error{display:none;background:var(--panel2);border:1px solid var(--error);border-radius:6px;padding:12px 14px;font-size:14px}

.filtros{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grupo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grupo label{font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.7px}
input[type=date],select,input[type=search]{font:inherit;font-size:13.5px;color:var(--texto);background:var(--panel2);border:1px solid var(--borde);border-radius:4px;padding:6px 9px;color-scheme:dark}
html[data-tema=claro] input,html[data-tema=claro] select{color-scheme:light}
input[type=search]{width:min(100%,260px)}
input::placeholder{color:var(--tenue)}
.nota-rango{font-size:12.5px;color:var(--suave);margin-left:auto}

nav.pestanas{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--borde);-webkit-overflow-scrolling:touch}
nav.pestanas button{font-size:14px;font-weight:500;color:var(--suave);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;white-space:nowrap;margin-bottom:-1px}
nav.pestanas button:hover{color:var(--texto)}
.subpestanas{display:flex;flex-wrap:wrap;gap:8px}
.subpestanas button{font-size:13.5px;font-weight:500;color:var(--suave);background:var(--panel2);border:1px solid var(--borde);border-radius:999px;padding:7px 14px}
.subpestanas button:hover{color:var(--texto)}
.subpestanas button span{font-family:var(--mono);font-size:12px;margin-left:6px;opacity:.85}
.subpestanas button[aria-selected=true]{color:var(--sobre-oro);background:var(--oro);border-color:var(--oro);font-weight:600}
nav.pestanas button[aria-selected=true]{color:var(--oro2);border-bottom-color:var(--oro);font-weight:600}

.panel{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:16px;min-width:0}
.kpi .rot{font-size:11.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.8px}
.kpi .val{margin-top:7px;font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.05;white-space:nowrap}
.kpi .nota{margin-top:7px;font-size:12.5px;color:var(--suave)}
.kpi.destacado{border-color:var(--oro)}
.bloque{display:flex;flex-direction:column;gap:10px}
.bloque>h3{margin:0;font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.bloque>h3 span{font-weight:400;font-size:12.5px;color:var(--suave)}
.kpi.tono{border-top-width:3px}
.kpi.tono.ok{border-top-color:var(--ok)} .kpi.tono.aviso{border-top-color:var(--aviso)} .kpi.tono.mal{border-top-color:var(--error)} .kpi.tono.oro{border-top-color:var(--oro)}
.kpi .val.txt{white-space:normal;font-size:19px;line-height:1.25;overflow-wrap:anywhere;font-family:var(--sans);font-weight:700;min-height:28px}
.kpi .desc{margin-top:7px;font-size:13px;line-height:1.35}
.kpi .comp{margin-top:7px;font-size:12px;color:var(--suave)}
.kpi .comp b{font-family:var(--mono);font-weight:600}
.kpi .comp .sube{color:var(--ok)} .kpi .comp .baja{color:var(--error)}
.kpi .medidor{height:5px;border-radius:3px;background:var(--panel2);margin-top:10px;overflow:hidden}
.kpi .medidor i{display:block;height:100%;border-radius:3px}
.delta{font-family:var(--mono);font-size:12px;font-weight:600}
.delta.sube{color:var(--ok)} .delta.baja{color:var(--error)} .delta.igual{color:var(--tenue)}

.fila{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.fila.dos{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
h2{margin:0 0 3px;font-size:15.5px;font-weight:600}
.ayuda{font-size:12.5px;color:var(--suave);margin:0 0 12px}
.cab{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.cab .ayuda{margin:0}
.cab .herr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.barra{display:flex;height:24px;border-radius:4px;overflow:hidden;gap:2px;background:var(--panel2)}
.barra span{display:block;min-width:3px}
.leyenda{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.leyenda div{display:flex;align-items:center;gap:9px;font-size:13.5px}
.leyenda i{flex:none;width:11px;height:11px;border-radius:2px}
.leyenda .n{margin-left:auto;font-family:var(--mono);font-weight:600}
.leyenda .p{font-family:var(--mono);color:var(--suave);width:54px;text-align:right;font-size:12.5px;white-space:nowrap}
.leyenda .n{white-space:nowrap}

.lista-bar{display:flex;flex-direction:column;gap:8px}
.lista-bar .l{display:grid;grid-template-columns:minmax(90px,36%) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.lista-bar .l>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-bar.mono .l>span:first-child{font-family:var(--mono);font-size:12.5px}
.lista-bar .pista{height:10px;background:var(--panel2);border-radius:2px}
.lista-bar .pista i{display:block;height:100%;border-radius:2px}
.lista-bar .n{font-family:var(--mono);text-align:right;white-space:nowrap}

.alertas{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alertas li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.alertas i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px}

.grafico{position:relative;width:100%}
.grafico svg{display:block;width:100%;overflow:visible}
.grafico text{font-family:var(--mono);font-size:11px;fill:var(--suave)}
.globo{position:absolute;pointer-events:none;background:var(--globo);border:1px solid var(--oro);border-radius:4px;padding:6px 9px;font-family:var(--mono);font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.claves{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px;font-size:12.5px;color:var(--suave)}
.claves span{display:flex;align-items:center;gap:6px}
.claves i{width:14px;height:3px;border-radius:2px}

.calor{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:3px;font-family:var(--mono);font-size:11px;color:var(--suave);align-items:center}
.calor .c{height:22px;border-radius:3px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--texto);font-size:10.5px}
.calor .sem{padding-right:8px;white-space:nowrap}
.calor .dia{text-align:center;padding-bottom:2px}

.vacio{font-size:13.5px;color:var(--suave);background:var(--panel2);border:1px dashed var(--borde);border-radius:6px;padding:14px}
.vacio code{font-family:var(--mono);color:var(--oro2);font-size:12.5px}

.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--suave);text-transform:uppercase;letter-spacing:.7px;padding:8px 10px;border-bottom:1px solid var(--borde);white-space:nowrap}
th button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;padding:0}
th button:hover,th button.activo{color:var(--oro2)}
td{padding:8px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.largo{white-space:normal;min-width:230px;max-width:420px;font-size:13px;line-height:1.4;color:var(--suave)}
td .id-api{display:block;font-family:var(--mono);font-size:11.5px;color:var(--tenue)}
td .correo{display:block;font-family:var(--mono);font-size:12px;color:var(--suave)}
tr:last-child td{border-bottom:0}
tr.clic{cursor:pointer}
tr.clic:hover td{background:var(--panel2)}
.eti{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:3px;border:1px solid var(--borde);color:var(--suave)}
.eti.activo{color:var(--ok);border-color:var(--ok)}
.eti.parado{color:var(--aviso);border-color:var(--aviso)}
.eti.sin_uso,.eti.baja{color:var(--error);border-color:var(--error)}
.eti.ex{color:var(--tenue)}
.eti.alta{color:var(--ok);border-color:var(--ok)}
.mini{display:inline-block;vertical-align:middle;width:70px;height:8px;background:var(--panel2);border-radius:2px;margin-right:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok)}
.pie-tabla{margin-top:10px;font-size:12.5px;color:var(--suave)}

dialog{width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--fondo);color:var(--texto);border:1px solid var(--oro);border-radius:10px;padding:18px;overflow:auto}
dialog::backdrop{background:rgba(5,9,18,.72)}
.ficha-cab{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.ficha-cab h2{font-size:19px}
footer{font-size:12px;color:var(--tenue);text-align:center;padding-top:6px}
@media (max-width:600px){
  h1{font-size:19px} .kpi .val{font-size:23px} .tarjeta{padding:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fila.dos{grid-template-columns:minmax(0,1fr)} .fila{grid-template-columns:minmax(0,1fr)}
  #reloj-box{display:none} .nota-rango{margin-left:0}
}
</style>
</head>

<script>
(function(){
"use strict";
var D=null,F={desde:null,hasta:null,empresa:""},TAB="resumen",K=null,G=null,TB={},Q={buscar:"",estado:"",rol:"",sub:"miembros",modelo:null,periodo:null,est:null};
var $=function(id){return document.getElementById(id)};
var PALETA=["var(--oro2)","var(--azul)","var(--verde)","var(--lila)","var(--rosa)","var(--aviso)","var(--tenue)"];
var DIA_SEM=["L","M","X","J","V","S","D"];

/* ---------------------------------------------------------- utilidades */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var nf;try{nf=new Intl.NumberFormat("es-ES",{useGrouping:"always",maximumFractionDigits:0})}catch(e){nf=new Intl.NumberFormat("es-ES")}
var nf1=new Intl.NumberFormat("es-ES",{maximumFractionDigits:1}),nfc=new Intl.NumberFormat("es-ES",{notation:"compact",maximumFractionDigits:1});
function num(v){return v==null?"—":nf.format(Math.round(v))}
function dec(v){return v==null?"—":nf1.format(v)}
function compacto(v){if(v==null)return"—";var a=Math.abs(v);if(a>=1e9)return nf.format(Math.round(v/1e6))+" M";if(a>=1e6)return nf1.format(v/1e6)+" M";if(a>=1e4)return nf1.format(v/1e3)+" mil";return nf.format(Math.round(v))}
function pct(n,t){return t?Math.round(n/t*100):0}
function pct1(n,t){if(!t||!n)return"0 %";var p=n/t*100;return p<0.1?"<0,1 %":p<10?nf1.format(p)+" %":Math.round(p)+" %"}
function dinero(v,d){if(v==null||!isFinite(v))return"—";var m=D.cfg.moneda||"USD";var o={style:"currency",currency:m,maximumFractionDigits:d||0,minimumFractionDigits:d||0};try{return new Intl.NumberFormat("es-ES",Object.assign({useGrouping:"always"},o)).format(v)}catch(e){try{return new Intl.NumberFormat("es-ES",o).format(v)}catch(x){return nf.format(v)+" "+m}}}
function fechaCorta(iso){if(!iso)return"—";var p=iso.split("-");return p[2]+"/"+p[1]}
function fechaLarga(iso){if(!iso)return"—";var p=iso.slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function aUTC(iso){var p=iso.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])}
function difDias(a,b){return Math.round((aUTC(a)-aUTC(b))/864e5)}
function masDias(iso,n){return new Date(aUTC(iso)+n*864e5).toISOString().slice(0,10)}
function masMeses(iso,n){var p=iso.split("-"),d=new Date(Date.UTC(+p[0],+p[1]-1+n,1)),ult=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(+p[2],ult));return d.toISOString().slice(0,10)}
function diaSemana(iso){return(new Date(aUTC(iso)).getUTCDay()+6)%7}
function vacio(html){return '<div class="vacio">'+html+'</div>'}
function suma(a,v){return v==null?a:(a||0)+v}
var NOMBRE_TIPO={chatgpt:"ChatGPT",codex:"Codex",automation:"Automation",sin_dato:"Sin dato"};
function nombreTipo(t){return NOMBRE_TIPO[t]||t||"—"}
var ESTADO={activo:"En uso",parado:"Parada",sin_uso:"Sin estrenar",ex:"Ya no es miembro"};
var PROD={
  chat:{n:"Chat",c:"var(--azul)",que:"La conversación normal con ChatGPT: se pregunta y responde al momento.",para:"Dudas, redacción, resúmenes, traducciones y consultas del día a día."},
  work:{n:"Work",c:"var(--oro2)",que:"Modo agente de ChatGPT: recibe un encargo y lo resuelve solo en varios pasos, navegando, ejecutando código y creando ficheros.",para:"Entregar un resultado terminado: informes, hojas de cálculo, presentaciones o análisis."},
  codex:{n:"Codex",c:"var(--verde)",que:"El agente de programación de OpenAI.",para:"Escribir, revisar y corregir código."},
  dots:{n:"Dots",c:"var(--lila)",que:"Asistentes personales que siguen trabajando en una tarea entre una conversación y otra.",para:"Seguimientos y tareas en segundo plano, sin tener la conversación abierta."},
  otro:{n:"Otros",c:"var(--tenue)",que:"Uso que la API no clasifica en ningún producto conocido.",para:"—"}
};
/* id de la API -> [nombre, producto, dónde se usa] */
var APP={
  CHAT_WEB:["Chat en el navegador","chat","En chatgpt.com, sin instalar nada."],
  CHAT_DESKTOP:["Chat en el ordenador","chat","En la aplicación de ChatGPT instalada en el ordenador."],
  CHAT_IOS:["Chat en iPhone y iPad","chat","En la aplicación de ChatGPT para iPhone y iPad."],
  CHAT_ANDROID:["Chat en Android","chat","En la aplicación de ChatGPT para Android."],
  CODEX_WORK_WEB:["Work en el navegador","work","En chatgpt.com; el agente trabaja en la nube."],
  CODEX_WORK_MOBILE:["Work en el móvil","work","En la aplicación del móvil; se lanza el encargo y se recoge el resultado."],
  CODEX_WORK_DESKTOP:["Work en el ordenador","work","En la aplicación de escritorio, donde puede trabajar con los ficheros del propio equipo."],
  CODEX_DESKTOP_APP:["Codex en el ordenador","codex","En la aplicación de escritorio de Codex."],
  CODEX_CLI:["Codex en la terminal","codex","Desde la línea de comandos."],
  CODEX_IDE:["Codex en el editor de código","codex","Como extensión del editor de programación."],
  CODEX_CLOUD:["Codex en la nube","codex","Tareas de programación lanzadas en la nube."],
  CODEX_UNKNOWN_DEFAULT:["Codex o Work sin identificar","codex","La API no indica desde qué aplicación se hizo."],
  DOTS:["Dots","dots","Funcionan en segundo plano, sin una aplicación abierta."]
};
function infoApp(v){
  var id=String(v).toUpperCase(),a=APP[id];
  if(a)return{id:id,nombre:a[0],prod:a[1],donde:a[2]};
  var prod=id.indexOf("CODEX_WORK")===0?"work":id.indexOf("CODEX")===0?"codex":id.indexOf("CHAT")===0?"chat":id.indexOf("DOT")===0?"dots":"otro";
  var limpio=id.replace(/^CODEX_WORK_|^CODEX_|^CHAT_/,"").replace(/_/g," ").toLowerCase();
  return{id:id,nombre:(prod==="otro"?"":PROD[prod].n+" · ")+(limpio||id.toLowerCase()),prod:prod,donde:"Identificador de la API: "+id+"."};
}
var ROL={member:"Miembro",owner:"Propietario",admin:"Administrador",account_owner:"Propietario",standard:"Miembro"};
function nombreRol(v){return ROL[String(v).toLowerCase()]||v||"—"}
function nombreApp(v){return infoApp(v).nombre}
function precioDe(p){return +(D.cfg.precio_puesto||{})[p.puesto]||0}
function delta(a,b){
  if(b==null||!isFinite(b))return"";
  if(!b)return a?'<span class="delta sube">nuevo</span>':"";
  var d=Math.round((a-b)/b*100);
  return '<span class="delta '+(d>0?"sube":d<0?"baja":"igual")+'" title="Frente al periodo anterior">'+(d>0?"▲ +":d<0?"▼ ":"= ")+d+' %</span>';
}

/* --------------------------------------------- preparación tras cargar */
function preparar(){

/* ------------------------------------------------------------- pestañas */
/* o: {rot, val, desc, tono, pct, color, comp, ayuda} */
function cifra(o){
  return '<div class="tarjeta kpi'+(o.tono?" tono "+o.tono:"")+'"'+(o.ayuda?' title="'+esc(o.ayuda)+'"':'')+'><div class="rot">'+esc(o.rot)+'</div><div class="val'+(o.texto?" txt":"")+'">'+o.val+'</div>'+
    '<div class="desc">'+o.desc+'</div>'+(o.pct!=null?'<div class="medidor"><i style="width:'+Math.max(0,Math.min(100,o.pct))+'%;background:'+(o.color||"var(--ok)")+'"></i></div>':'')+
    (o.comp?'<div class="comp">'+o.comp+'</div>':'')+'</div>';
}
function comparar(a,b,inverso){
  if(!K.prev||b==null||!isFinite(b))return"";
  var txt="los "+K.n+" días anteriores";
  if(!b)return a?"Sin actividad en "+txt:"";
  var d=Math.round((a-b)/b*100);
  if(!d)return"Igual que en "+txt;
  var bueno=inverso?d<0:d>0;
  return '<b class="'+(bueno?"sube":"baja")+'">'+(d>0?"▲ "+d+" % más":"▼ "+Math.abs(d)+" % menos")+'</b> que en '+txt;
}
function bloque(titulo,sub,tarjetas){return '<section class="bloque"><h3>'+titulo+'<span>'+sub+'</span></h3><div class="kpis">'+tarjetas+'</div></section>'}
function kpi(rot,val,nota,destacado){return '<div class="tarjeta kpi'+(destacado?" destacado":"")+'"><div class="rot">'+esc(rot)+'</div><div class="val">'+val+'</div><div class="nota">'+nota+'</div></div>'}
function tarjeta(titulo,ayuda,cuerpo,herr){return '<div class="tarjeta"><div class="cab"><div><h2>'+titulo+'</h2><p class="ayuda">'+ayuda+'</p></div>'+(herr?'<div class="herr">'+herr+'</div>':'')+'</div>'+cuerpo+'</div>'}
function etqDias(){return K.fechas.map(fechaCorta)}
function titDias(){return K.fechas.map(function(f){return DIA_SEM[diaSemana(f)]+" "+fechaLarga(f)})}

    cifra({rot:"Sin estrenar",val:num(k.est.sin_uso),desc:"nunca han usado ChatGPT",tono:"mal",pct:pct(k.est.sin_uso,t),color:"var(--error)",comp:"<b>"+pct(k.est.sin_uso,t)+" %</b> de las licencias",ayuda:"Tienen licencia y no hay ningún uso registrado."}));
  /* 2. ¿Cuánto se ha usado? Depende del periodo elegido */
  h+=bloque("¿Cuánto se ha usado?","Del "+fechaLarga(F.desde)+" al "+fechaLarga(F.hasta)+" · "+k.n+" días",

    cifra({rot:"Mensajes por persona",val:k.usan?num(k.T.m/k.usan):"—",desc:"de media entre quienes lo usan",comp:lab&&k.usan?"unos <b>"+dec(k.T.m/k.usan/lab)+"</b> por día laborable":"",ayuda:"Mensajes del periodo entre personas que lo han usado."})+
    cifra({rot:"Personas al día",val:lab?dec(sumaAct/lab):"—",desc:"lo usan de media un día laborable",comp:t?"<b>"+pct(lab?sumaAct/lab:0,t)+" %</b> de las licencias":"",ayuda:"Media de personas activas en los días laborables del periodo."}));
  /* 3. ¿Cuánto cuesta? */
  var coste="";
  if(k.costeMes)coste+=cifra({rot:"Licencias al mes",val:dinero(k.costeMes),desc:num(t)+" licencias × "+dinero(k.costeMes/Math.max(1,t),2),tono:"oro",ayuda:"Precio por licencia de la configuración por el número de miembros."});
  if(k.T.g!=null)coste+=cifra({rot:"Consumo de uso",val:dinero(k.T.g,2),desc:"facturado por uso en el periodo, aparte de las licencias",comp:comparar(k.T.g,k.prev&&k.prev.g,true),ayuda:"Importe que OpenAI factura por los tokens consumidos, convertido a la moneda del panel."});
  else if(k.T.cr!=null)coste+=cifra({rot:"Créditos consumidos",val:compacto(k.T.cr),desc:"en el periodo",comp:comparar(k.T.cr,k.prev&&k.prev.cr,true)});
  if(k.costeMes&&k.T.g!=null&&k.usan)coste+=cifra({rot:"Coste por persona activa",val:dinero((k.costeMes*k.n/30.44+k.T.g)/k.usan,2),desc:"licencias y consumo del periodo entre quienes lo usan",ayuda:"Coste de las licencias prorrateado a los días del periodo, más el consumo, dividido entre las personas que lo han usado."});
  if(k.costeMes)coste+=cifra({rot:"Licencias sin aprovechar",val:dinero(k.inmovil),desc:"al mes en "+num(k.reasignar.length)+" licencias sin estrenar o paradas más de "+D.cfg.dias_reasignar+" días",tono:k.inmovil?"mal":"ok",ayuda:"Coste mensual de las licencias candidatas a reasignar."});
  if(coste)h+=bloque("¿Cuánto cuesta?","Importes en "+esc(D.cfg.moneda||"USD")+" · el detalle está en Consumo y coste y en Facturación",coste);
  /* alertas */
  var al=[];

  var lejos=k.reasignar.length-k.est.sin_uso;

  var pico=-1;k.dia.forEach(function(x,i){if(pico<0||x.m>k.dia[pico].m)pico=i});
  if(pico>=0&&k.dia[pico].m)al.push(["var(--azul)","Día de más uso: <b>"+fechaLarga(k.fechas[pico])+"</b> con "+num(k.dia[pico].m)+" mensajes y "+num(k.dia[pico].act)+" personas."]);
  if(k.T.cr==null&&k.T.g==null&&k.T.m)al.push(["var(--tenue)","La API todavía no informa el consumo facturado de este workspace."]);
  if(!al.length)al.push(["var(--ok)","Sin incidencias que destacar."]);
  h+='<section class="fila">'+tarjeta("Reparto de las licencias","Según el último día en que cada persona usó ChatGPT.",reparto([["En uso (últimos "+D.cfg.dias_activo+" días)",k.est.activo,"var(--ok)"],["Paradas",k.est.parado,"var(--aviso)"],["Sin estrenar",k.est.sin_uso,"var(--error)"]],t));
  h+=tarjeta("A destacar","Avisos calculados con los filtros actuales.",'<ul class="alertas">'+al.map(function(a){return '<li><i style="background:'+a[0]+'"></i><span>'+a[1]+'</span></li>'}).join("")+'</ul>');
  h+=tarjeta("Quién más lo usa","Mensajes enviados en el periodo.",'<div id="r-top"></div>')+'</section>';
  h+='<section class="fila dos">'+tarjeta("Mensajes por día","Del "+fechaLarga(F.desde)+" al "+fechaLarga(F.hasta)+".",'<div id="g1"></div>')+tarjeta("Personas activas por día","Personas con uso ese día.",'<div id="g2"></div>')+'</section>';
  return h;
};

function contrato(){
  var o={comp:D.cfg.compromiso_anual,licMes:0};
  D.personas.forEach(function(p){if(p.miembro)o.licMes+=precioDe(p)});
  if(!o.comp)return o;
  o.ini=D.cfg.contrato_inicio||(D.dias.length?D.dias[0]:D.hoy);o.fin=masDias(o.ini,364);
  o.empezado=o.ini<=D.hoy;o.pasados=o.empezado?Math.max(1,Math.min(365,difDias(D.hoy,o.ini)+1)):0;
  var per=D.hoy.slice(0,8)+o.ini.slice(8);if(per>D.hoy)per=masMeses(per,-1);if(per<o.ini)per=o.ini;o.per=per;
  o.uso=0;o.usoPer=0;
  D.uso.forEach(function(r){var f=D.dias[r[0]];if(f<o.ini||f>o.fin)return;var g=gasto(r)||0;o.uso+=g;if(f>=per)o.usoPer+=g});
  o.licDev=o.licMes*12*o.pasados/365;o.gastado=o.licDev+o.uso;
  o.licAnual=o.licMes*12;o.usoPrev=o.pasados?o.uso/o.pasados*365:0;o.prev=o.licAnual+o.usoPrev;o.dif=o.comp-o.prev;
  o.margenAnual=Math.max(0,o.comp-o.licAnual);o.margenMes=o.margenAnual/12;
  return o;
}

/* periodos de facturación: mensuales desde el inicio del contrato; antes, meses naturales */
function periodos(){
  var ini=D.cfg.contrato_inicio,out=[],k;
  if(ini&&ini<=D.hoy)for(k=0;k<60;k++){var a=masMeses(ini,k),b=masDias(masMeses(ini,k+1),-1);if(a>D.hoy)break;out.push({ini:a,fin:b,actual:b>=D.hoy,previo:false,etq:fechaLarga(a)+" – "+fechaLarga(b)})}
  var meses={};D.dias.forEach(function(d){if(!ini||ini>D.hoy||d<ini)meses[d.slice(0,7)]=1});
  Object.keys(meses).forEach(function(m){var a=m+"-01",b=masDias(masMeses(a,1),-1);if(ini&&ini<=D.hoy&&b>=ini)b=masDias(ini,-1);out.push({ini:a,fin:b,actual:false,previo:!!ini&&ini<=D.hoy,natural:true,etq:m.slice(5)+"/"+m.slice(0,4)+(ini&&ini<=D.hoy?" (antes del contrato)":"")})});
  return out.sort(function(x,y){return x.ini<y.ini?1:-1});
}
function costePeriodo(per){
  /* por empresa: puestos (estimados con los miembros actuales) y consumo de uso del periodo */
  var e={},de=function(n){return e[n]||(e[n]={nombre:n,puestos:0,cp:null,g:null,m:0,tt:0,usan:{}})};
  var largo=difDias(per.fin,per.ini)+1,hechos=per.actual?Math.max(1,difDias(D.hoy,per.ini)+1):largo,factor=per.natural&&!per.previo?hechos/largo:per.actual?hechos/largo:1;

  var f=PEST[TAB]||PEST.resumen;

$("pestanas").addEventListener("keydown",function(e){
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  var bs=Array.prototype.slice.call(this.children),i=bs.findIndex(function(b){return b.getAttribute("data-tab")===TAB});
  i=(i+(e.key==="ArrowRight"?1:-1)+bs.length)%bs.length;bs[i].click();bs[i].focus();
});
document.addEventListener("click",function(e){
  var t=e.target,b;
  if((b=t.closest("button[data-k]"))){var st=TB[b.getAttribute("data-tabla")],k=b.getAttribute("data-k"),c=st.cols.filter(function(x){return x.k===k})[0];
    st.orden=st.orden&&st.orden.k===k?{k:k,dir:-st.orden.dir}:{k:k,dir:c&&c.num?-1:1};pintarTabla(b.getAttribute("data-tabla"));return}
  if((b=t.closest("button[data-sub]"))){Q.sub=b.getAttribute("data-sub");Q.estado="";Q.rol="";pintarTab();return}
  if((b=t.closest("button[data-csv]"))){exportar(b.getAttribute("data-csv"));return}
  if(t.id==="ficha-cerrar"){cerrarFicha();return}
  if(t.id==="ficha"){cerrarFicha();return}
  if((b=t.closest("tr.clic"))){var s=TB[b.getAttribute("data-tabla")];if(s&&s.click)s.click(s.vista[+b.getAttribute("data-i")])}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.matches&&e.target.matches("tr.clic")){e.target.click()}});
document.addEventListener("input",function(e){
  if(e.target.id==="q-buscar"){Q.buscar=e.target.value;PEST.personas.despues()}
  if(/^e-(tokens|consultas|personas|dias)$/.test(e.target.id))leerEstimador(e.target.id);
});
document.addEventListener("change",function(e){
  if(e.target.id==="q-estado"){Q.estado=e.target.value;PEST.personas.despues()}
  if(e.target.id==="q-rol"){Q.rol=e.target.value;PEST.personas.despues()}
  if(e.target.id==="q-periodo"){Q.periodo=e.target.value;PEST.factura.despues()}
  if(e.target.id==="e-modelo"||e.target.id==="e-tipo")leerEstimador(e.target.id);
});
function tema(t){document.documentElement.setAttribute("data-tema",t);$("btn-tema").textContent=t==="claro"?"Tema oscuro":"Tema claro";try{localStorage.setItem("dash-ia-tema",t)}catch(e){}}
$("btn-tema").addEventListener("click",function(){tema(document.documentElement.getAttribute("data-tema")==="claro"?"oscuro":"claro")});
try{if(localStorage.getItem("dash-ia-tema")==="claro")tema("claro")}catch(e){}
/* mismo formato que el resto de dashboards de SGP */
var DIAS_SEMANA=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],MESES_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function fmtReloj(d){var p=function(n){return String(n).padStart(2,"0")};return DIAS_SEMANA[d.getDay()]+", "+d.getDate()+" de "+MESES_ES[d.getMonth()]+" de "+d.getFullYear()+", "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
function reloj(){$("clock").textContent=fmtReloj(new Date())}
reloj();setInterval(reloj,1000);
var h0=(location.hash||"").slice(1);if(PEST[h0])TAB=h0;
var tr;window.addEventListener("resize",function(){clearTimeout(tr);tr=setTimeout(function(){if(D&&!$("ficha").open)pintarTab()},180)});
pintarTab();cargar();setInterval(function(){if(!$("ficha").open)cargar()},5*60*1000);
})();
